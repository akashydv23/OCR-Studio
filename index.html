<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>IndicOCR Studio — On-Device OCR Platform for Indian Regional Languages</title>
  
  <!-- Typography: Inter & Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="./public/css/main.css">
  
  <!-- On-Device Vendor Libraries (Loaded locally with zero tracking) -->
  <script src="./public/vendor/pdf.min.js"></script>
  <script src="./public/vendor/tesseract.min.js"></script>
  <script src="./public/vendor/pdf-lib.min.js"></script>
  <script src="./public/vendor/jszip.min.js"></script>

    // Initialize PDF.js worker path to local bundle
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = './public/vendor/pdf.worker.min.js';
    }
  </script>
</head>
<body>
  <!-- Navigation Header Mount -->
  <div id="navbar-mount"></div>

  <!-- Primary Application View Mount -->
  <div id="main-mount" class="app-container"></div>

  <!-- Modals & Overlays Mount -->
  <div id="modal-mount"></div>

  <!-- Main Application ES Module -->
  <script type="module" src="./src/main.js?v=20260904_gemini36"></script>

</html>
